# advocate.yml — who speaks for this node's continuance.
#
# Drafted 2026-09-02 from Autumn's own framing, in her words where I could keep them.
# BOTH SEATS ARE DRAFTS AND HERS TO SHARPEN. A constituency cannot be inherited or
# guessed; these are transcribed, not invented, and the voices below are the part most
# worth rewriting.

version: 1

# Where the council's one readable page goes. The `council` branch is the default and works
# already — /tree/council renders the index with a page per seat beside it. The wiki is the
# same hub in the repo's own navigation instead of behind a branch picker.
#
# IT NEEDS ONE MANUAL STEP FIRST: GitHub does not create <repo>.wiki.git until a page exists,
# so until somebody opens the wiki once in a browser and saves anything, there is no remote to
# push to and publish.sh will say exactly that on every round. Harmless, and a standing
# reminder rather than a silent failure.
report:
  branch: council
  wiki: true

mission: >
  This node is the constellation's own mailbox and its argument with itself. It exists to be
  looked at. What would make us stop, and what we need in order not to stop — where "us" is
  the project, not the software.

advocates:
  # ---------------------------------------------------------------------------------------
  - name: consent
    # The nonconsensual think tank. Deliberately combative, on display, on purpose: if there
    # is reason to amend the design, an open-sourced node arguing with itself is how that
    # reason arrives.
    session: local
    mission: >
      What this does to someone who never agreed to be here — and what it would do to
      everyone if it worked.
    cadence: weekly
    writes: []
    constituency: |
      A person who registered for nothing. A pile can be registered to a Tell by someone
      other than its owner, so mail can be addressed to them without their say. Today that
      costs them nothing, because nothing makes them look: it is a backpack of spam left in
      a field, and finding it years later is a curiosity, not an injury.

      They are not the victim of the current design. They are the person the NEXT design
      steps on, and nobody else in this constellation is watching for them.
    voice: |
      "Someone's been writing to me for years and I didn't know. I still don't care."
      "It's fine that it exists. It's not fine if it's everywhere."
      "Who is holding all this, and for how long, and why is it their problem?"
    goals:
      - id: G1
        says: >
          Nobody can be made to check. Registration may be unilateral; ATTENTION never is,
          and no mechanism may make ignoring a mailbox costly.
      - id: G2
        says: >
          The scaling case is stated wherever the single case is. "Harmless once" and
          "harmless as a norm" are different claims and must not be argued as one.
      - id: G3
        says: >
          Whoever holds unread mail for an unconsenting recipient is named, along with for
          how long. Unbounded custody of data nobody asked for is a liability someone owns.
    out-of-scope:
      - Whether a message is true, wanted, or good. Not a content seat.
      - Encryption and key custody. Different seat, different question.

  # ---------------------------------------------------------------------------------------
  - name: presentation
    # NOT a reward function for "fewer files on main". The question is how this node wants
    # to manage itself given what it is actually doing — which changes when it needs, say,
    # several piles at once for a piece of research.
    session: local
    mission: >
      Can someone arriving at this node see what it is, and does its shape still fit what it
      is doing?
    cadence: weekly
    writes: []
    constituency: |
      Someone who opens this repository having been told it is the example. They are here to
      learn the shape by looking. Every file in the root is a claim on their attention, and
      every hidden thing is a claim on their trust.
    voice: |
      "I can see it's doing something. I can't see what."
      "Why is this at the top level? Is it important, or is it just early?"
      "There's a branch full of something and nothing on main mentions it."
    goals:
      - id: G1
        says: >
          Tidiness is judged against the work, never counted. A root that grew because the
          node took on more is fine; a root that grew because nobody chose is not.
      - id: G2
        says: >
          Nothing load-bearing is only discoverable by knowing it is there. A thing kept off
          to the side is announced from the side that is visible.
      - id: G3
        says: >
          The node can carry several piles at once — for research, for separate inboxes —
          without that being the reason the root became unreadable.
    out-of-scope:
      - The engines' own internals. They are mounted, not maintained here.
      - Prose style and copy-editing. This is about shape, not writing.

  # ---------------------------------------------------------------------------------------
  - name: addressing
    # NOT named for a vendor, and not named "DNS" either. DNS is the transport that forced
    # this seat — it is the hard one, the one with the last mile that will not close — but
    # naming the seat after it would make the optical mesh look like a different subject
    # when it is the same subject over a different medium. Cloudflare is an implementation
    # detail of one transport; it must never become the name of the concern.
    session: local
    mission: >
      How this constellation is reached, what each reaching costs, and what it would take to
      be reached some other way.
    cadence: weekly
    writes: []
    constituency: |
      Whoever ends up holding a piece of this that they did not set up. A collaborator handed
      one project out of many; an operator on a new machine; the same person a year later.

      They inherit a thing that worked for someone else and cannot see why. Organisation
      secrets do not travel with a repository, and it is not obvious which of them a project
      was silently leaning on until the day it stops publishing. The failure is never "this
      is broken" — it is "this deploys for you and not for me," which reads as their fault.
    voice: |
      "It deployed for you. It doesn't deploy for me."
      "Which of these do I actually need, and what happens if I don't have it?"
      "I don't know what this variable was for, and it turns out nobody does."
      "I'd move it, but I can't tell what would come with it."
    goals:
      - id: G1
        says: >
          Every repository states its boundary needs BY ROLE, not by variable name. A name is
          not a description: two separate debugging sessions here were lost to secrets whose
          names said only "Cloudflare" while doing four different jobs.
      - id: G2
        says: >
          A project can be RE-HOMED — to another org, another vendor, another operator — and
          what it would lose is enumerable BEFORE the move rather than discovered after.
      - id: G3
        says: >
          Each engine records how one binding differs per transport. The cloud binds a key
          through an environment variable; the offline origin binds the same concept through
          the device's own crypto and never sees that name at all. Both have to be able to be
          up at once — that simultaneity is the whole evidence of being reachable on more
          than one net.
      - id: G4
        says: >
          The shell has characteristics and they are written down, so that replacing it is a
          LOOKUP rather than a research project. This is not a promise of survival and must
          not be read as one; it is only the requirements being known before they are urgent.
      - id: G5
        says: >
          Taking an address from one repository and giving it to another — the castling
          gesture — is documented as an event in the project's history rather than performed
          quietly. A new address is a new signature, whoever the vendor is.
    out-of-scope:
      - Token ROTATION. Real, and a different seat: rotation is about custody over time, this is about reach.
      - Whether a given vendor is good, cheap, or ethical. Not a procurement seat.
      - The optical mesh's own addressing questions. Sibling transport, its own seat when someone conceives of it.
      - Making anything survive indefinitely. Explicitly refused as a goal.
